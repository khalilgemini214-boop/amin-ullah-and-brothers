name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found on the runner"
            exit 1
          fi

          SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMGR" ]; then
            SDKMGR=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build:web
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/release.keystore"
            echo "keystore=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_OUTPUT"
            echo "::notice::Building with the permanent release keystore."
          else
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. The APK will be debug-signed, and future APKs cannot be installed as an update over it. See README-UPDATES.md."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect release files
        run: |
          mkdir -p dist
          cp www/app.html dist/app.html
          cp android/app/build/outputs/apk/release/app-release.apk dist/app.apk

      - name: Generate update manifest
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: node scripts/make-manifest.mjs dist/app.html dist/app.apk dist/update.json

      - name: Release metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./dist/update.json').version")
          WEB_BUILD=$(node -p "require('./dist/update.json').webBuild")
          NATIVE_CODE=$(node -p "require('./dist/update.json').nativeVersionCode")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "webBuild=$WEB_BUILD" >> "$GITHUB_OUTPUT"
          echo "native=$NATIVE_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AminBrothers-v${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.webBuild }}
          path: |
            dist/app.apk
            dist/app.html
            dist/update.json
          if-no-files-found: error

      - name: Move "latest" tag to this build
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Amin Ullah & Brothers v${{ steps.meta.outputs.version }} (build ${{ steps.meta.outputs.webBuild }})
          make_latest: true
          body: |
            Automatic build from `${{ github.sha }}`.

            - App version: `${{ steps.meta.outputs.version }}`
            - Web build: `${{ steps.meta.outputs.webBuild }}`
            - Native version code: `${{ steps.meta.outputs.native }}`

            **Download `app.apk` below to install/update the app.**
            The app also checks this release automatically on launch.
          files: |
            dist/app.apk
            dist/app.html
            dist/update.json
          preserve_order: true
          fail_on_unmatched_files: true
